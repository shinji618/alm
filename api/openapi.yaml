      - approval.decide
      - asset.write
      x-scope:
        approval.decide:
          DEPT_MANAGER: CC
          ASSET_ACCOUNTANT: ALL
        asset.write:
          ASSET_MANAGER: ALL
      x-condition: 승인 단계의 역할·범위(부서 관리자가 없으면 자산회계, 1단계 회사는 자산 관리자 대리), 요청자 본인 아님, 같은 요청의 앞 단계 승인자 아님
