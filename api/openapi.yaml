components:
  securitySchemes:
    webAuth:
      type: oauth2
      description: Cognito 호스티드 UI + 고객사 SSO(SAML/OIDC). Authorization Code + PKCE. 액세스 60분, 리프레시 8시간(근무일 기준)
      flows:
        authorizationCode:
          authorizationUrl: https://auth.{domain}/oauth2/authorize
          tokenUrl: https://auth.{domain}/oauth2/token
          scopes:
            web: 웹 화면
    pdaAuth:
      type: oauth2
      description: Cognito 호스티드 UI + 고객사 SSO. Authorization Code + PKCE. 액세스 60분, 리프레시 24시간
      flows:
        authorizationCode:
          authorizationUrl: https://auth.{domain}/oauth2/authorize
          tokenUrl: https://auth.{domain}/oauth2/token
          scopes:
            pda: PDA 실사
    sapAuth:
      type: oauth2
      description: Client Credentials. 토큰 60분
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            sap.api: SAP 연계
  parameters:
    SapSystem:
      name: X-SAP-System
      in: header
      required: false
      schema:
        type: string
        maxLength: 10
      description: 'SAP 시스템ID-클라이언트 (예: PRD-100). 로그 기록용. sap_connection과 다르면 403'
    CompanyCode:
      name: X-Company-Code
      in: header
      required: false
      schema:
        type: string
        maxLength: 4
      description: 회사코드. 토큰에 허용된 회사코드가 아니면 403
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려줌
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 80
      description: 24시간 안의 같은 키는 저장된 응답을 그대로 반환
  responses:
    E400:
      description: 형식 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: 인증 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 권한 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: 대상 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: 충돌
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E410:
      description: 동기화 토큰 만료
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E413:
      description: 파일 크기 초과
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: 업무 규칙 위반
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E502:
      description: 외부 장치 연결 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: 호출 제한
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E500:
      description: 서버 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: 오류 응답 (RFC 9457 application/problem+json)
      properties:
        type:
          type: string
          description: '오류 유형 URI (예: https://alm.bsg/errors/validation)'
        title:
          type: string
          description: 요약
        status:
          type: integer
          description: HTTP 상태
        code:
          type: string
          description: 'ALM 오류 코드 (예: ALM-E104)'
        detail:
          type: string
          description: 상세 설명
        correlationId:
          type: string
          format: uuid
          description: X-Correlation-Id 값
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: 필드별 오류
      required:
      - type
      - title
      - status
      - code
      - correlationId
    FieldError:
      type: object
      description: 필드 오류
      properties:
        field:
          type: string
          description: 'JSON 경로 (예: records[3].costCenter)'
        code:
          type: string
          description: ALM 오류 코드
        message:
          type: string
          description: 메시지
      required:
      - field
      - code
      - message
    ItemResult:
      type: object
      description: 배치 건별 결과
      properties:
        key:
          type: string
          description: '레코드 키 (예: 1000/000300001234/0000)'
        status:
          type: string
          enum:
          - OK
          - ERROR
          - SKIPPED
          description: OK 반영, ERROR 오류, SKIPPED 변경 없음
        code:
          type: string
          description: 오류 코드
        message:
          type: string
          description: 메시지
      required:
      - key
      - status
    BatchResult:
      type: object
      description: 배치 수신 응답. 일부 오류면 HTTP 207
      properties:
        batchId:
          type: string
          description: 요청의 batchId
        received:
          type: integer
          description: 받은 건수
        succeeded:
          type: integer
          description: 반영 건수
        failed:
          type: integer
          description: 오류 건수
        results:
          type: array
          items:
            $ref: '#/components/schemas/ItemResult'
          description: 건별 결과(오류·SKIPPED만 담고, 성공 건은 생략 가능)
      required:
      - batchId
      - received
      - succeeded
      - failed
      - results
    PdaMe:
      type: object
      description: 로그인 사용자와 앱 설정
      properties:
        userId:
          type: string
          format: uuid
          description: app_user.id
        displayName:
          type: string
          description: 이름
        email:
          type: string
          description: 이메일
        locale:
          type: string
          enum:
          - en
          - ko
          description: 화면 언어
        roles:
          type: array
          items:
            type: string
          description: 역할 코드 (COUNTER 필수)
        tenantCode:
          type: string
          description: 테넌트 코드
        serverTime:
          type: string
          format: date-time
          description: 서버 시각(기기 시계 보정용)
        minAppVersion:
          type: string
          description: 최소 앱 버전. 낮으면 업데이트 안내
        offlineHours:
          type: integer
          description: 오프라인 허용 시간(기본 24)
      required:
      - userId
      - displayName
      - email
      - locale
      - roles
      - tenantCode
      - serverTime
      - minAppVersion
      - offlineHours
    DeviceRegister:
      type: object
      description: 기기 등록 요청
      properties:
        deviceSerial:
          type: string
          maxLength: 40
          description: 기기 시리얼
        model:
          type: string
          maxLength: 40
          description: '모델 (예: TC58)'
        appVersion:
          type: string
          maxLength: 20
          description: 앱 버전
      required:
      - deviceSerial
      - appVersion
    Device:
      type: object
      description: 기기 등록 결과
      properties:
        deviceId:
          type: string
          format: uuid
          description: pda_device.id
        lastSyncAt:
          type: string
          format: date-time
          description: 마지막 동기화
      required:
      - deviceId
    PdaTask:
      type: object
      description: 내 룸 실사 작업
      properties:
        taskId:
          type: string
          format: uuid
          description: count_task.id
        campaignId:
          type: string
          format: uuid
          description: 캠페인
        campaignCode:
          type: string
          maxLength: 6
          description: '캠페인 코드 (예: PI26Q4)'
        campaignName:
          type: string
          description: 캠페인 이름
        keyDate:
          type: string
          format: date
          description: 기준일
        dueDate:
          type: string
          format: date
          description: 기한
        roomId:
          type: string
          format: uuid
          description: 룸
        roomCode:
          type: string
          maxLength: 10
          description: 룸 코드
        roomName:
          type: string
          description: 룸 이름
        siteCode:
          type: string
          maxLength: 10
          description: 사이트
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          description: 작업 상태
        expectedCount:
          type: integer
          description: 대상 자산 수
        foundCount:
          type: integer
          description: 확인(FOUND) 수
        pendingCount:
          type: integer
          description: 미확인 수
        updatedAt:
          type: string
          format: date-time
          description: 변경 일시
      required:
      - taskId
      - campaignId
      - campaignCode
      - campaignName
      - keyDate
      - dueDate
      - roomId
      - roomCode
      - roomName
      - siteCode
      - status
      - expectedCount
      - foundCount
      - pendingCount
      - updatedAt
    PdaTaskList:
      type: object
      description: 내 작업 목록
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PdaTask'
          description: 작업
      required:
      - items
    WorklistItem:
      type: object
      description: 작업목록의 실사 대상 1건
      properties:
        countItemId:
          type: string
          format: uuid
          description: count_item.id
        assetId:
          type: string
          format: uuid
          description: 자산
        assetTag:
          type: string
          maxLength: 25
          description: 자산태그(바코드 값)
        description:
          type: string
          maxLength: 50
          description: 자산명
        categoryName:
          type: string
          description: 카테고리
        model:
          type: string
          description: 모델
        serialNo:
          type: string
          maxLength: 40
          description: 시리얼
        assetStatus:
          type: string
          enum:
          - ON_ORDER
          - IN_STOCK
          - IN_USE
          - IN_REPAIR
          - MISSING
          - RETIRED
          - DISPOSED
          description: 자산 상태
        expectedRoomId:
          type: string
          format: uuid
          description: 등록 룸
        expectedRoomCode:
          type: string
          maxLength: 10
          description: 등록 룸 코드
        assignedUserName:
          type: string
          description: 사용자(PDA-05 사용자 확인)
        result:
          type: string
          enum:
          - PENDING
          - FOUND
          - MISPLACED
          - NOT_FOUND
          description: 서버 기준 판정
        countedAt:
          type: string
          format: date-time
          description: 실사 일시
        updatedAt:
          type: string
          format: date-time
          description: 변경 일시(델타 기준)
      required:
      - countItemId
      - assetId
      - assetTag
      - description
      - categoryName
      - assetStatus
      - expectedRoomId
      - expectedRoomCode
      - result
      - updatedAt
    WorklistPage:
      type: object
      description: 작업목록 페이지. syncToken으로 다음 델타를 받음
      properties:
        campaignId:
          type: string
          format: uuid
          description: 캠페인
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorklistItem'
          description: 대상(최대 limit건)
        removed:
          type: array
          items:
            type: string
            format: uuid
          description: 범위에서 빠진 countItemId(델타일 때)
        nextCursor:
          type: string
          description: 다음 페이지 커서. 없으면 마지막
        syncToken:
          type: string
          description: 마지막 페이지에서 저장. 다음 호출의 since로 사용
      required:
      - campaignId
      - items
      - removed
      - syncToken
    TagIndexItem:
      type: object
      description: 범위 밖 자산태그(오프라인 판정용)
      properties:
        assetTag:
          type: string
          maxLength: 25
          description: 자산태그
        assetStatus:
          type: string
          enum:
          - ON_ORDER
          - IN_STOCK
          - IN_USE
          - IN_REPAIR
          - MISSING
          - RETIRED
          - DISPOSED
          description: 자산 상태
        siteCode:
          type: string
          maxLength: 10
          description: 사이트
      required:
      - assetTag
      - assetStatus
    TagIndexPage:
      type: object
      description: 범위 밖 태그 색인 페이지
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TagIndexItem'
          description: 태그
        nextCursor:
          type: string
          description: 다음 페이지 커서
        syncToken:
          type: string
          description: 다음 델타의 since
      required:
      - items
      - syncToken
    PdaRoom:
      type: object
      description: 룸
      properties:
        roomId:
          type: string
          format: uuid
          description: 룸
        roomCode:
          type: string
          maxLength: 10
          description: 룸 코드
        name:
          type: string
          description: 이름
        floor:
          type: string
          description: 층
        siteCode:
          type: string
          maxLength: 10
          description: 사이트
        barcode:
          type: string
          maxLength: 30
          description: 룸 바코드 값
      required:
      - roomId
      - roomCode
      - name
      - siteCode
      - barcode
    PdaRoomList:
      type: object
      description: 룸 목록
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PdaRoom'
          description: 룸
      required:
      - items
    PdaCodes:
      type: object
      description: PDA 코드값
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CodeItem'
          description: 미등록 자산 카테고리
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/CodeItem'
          description: 자산 상태(GOOD, DAMAGED, UNUSED)
      required:
      - categories
      - conditions
    CodeItem:
      type: object
      description: 코드
      properties:
        id:
          type: string
          description: 코드 또는 id
        label:
          type: string
          description: 이름(사용자 언어)
      required:
      - id
      - label
    TaskUpdate:
      type: object
      description: 룸 작업 시작·완료
      properties:
        action:
          type: string
          enum:
          - START
          - COMPLETE
          description: 시작 또는 완료(PDA-07)
        at:
          type: string
          format: date-time
          description: 기기 시각
        force:
          type: boolean
          description: 미확인 자산이 남아도 완료(기본 false)
      required:
      - action
      - at
    ScanIn:
      type: object
      description: 스캔 1건
      properties:
        clientScanId:
          type: string
          format: uuid
          description: PDA가 만든 UUID. 멱등성 키
        campaignId:
          type: string
          format: uuid
          description: 캠페인
        taskId:
          type: string
          format: uuid
          description: 현재 룸 작업
        roomId:
          type: string
          format: uuid
          description: 현재 룸(PDA-03에서 선택)
        barcode:
          type: string
          maxLength: 40
          description: 읽은 값
        inputMethod:
          type: string
          enum:
          - TRIGGER
          - CAMERA
          - MANUAL
          description: 입력 방법
        deviceResult:
          type: string
          enum:
          - FOUND
          - MISPLACED
          - OUT_OF_SCOPE
          - UNREGISTERED
          - DUPLICATE
          - RETIRED_ASSET
          description: 기기 판정(참고값)
        condition:
          type: string
          enum:
          - GOOD
          - DAMAGED
          - UNUSED
          description: 상태 입력(PDA-05)
        isUserConfirmed:
          type: boolean
          description: 사용자 확인
        needsRelabel:
          type: boolean
          description: 라벨 재출력 요청 → label_print_job 생성
        note:
          type: string
          maxLength: 200
          description: 메모
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
          description: 사진(미리 업로드한 첨부)
        scannedAt:
          type: string
          format: date-time
          description: 기기 스캔 시각
      required:
      - clientScanId
      - campaignId
      - taskId
      - roomId
      - barcode
      - inputMethod
      - deviceResult
      - scannedAt
    ScanBatch:
      type: object
      description: 스캔 일괄 전송(최대 200건)
      properties:
        deviceId:
          type: string
          format: uuid
          description: 기기
        scans:
          type: array
          items:
            $ref: '#/components/schemas/ScanIn'
          description: 스캔(scannedAt 순)
      required:
      - deviceId
      - scans
    ScanResultItem:
      type: object
      description: 스캔 건별 처리 결과
      properties:
        clientScanId:
          type: string
          format: uuid
          description: 요청의 clientScanId
        status:
          type: string
          enum:
          - ACCEPTED
          - DUPLICATE
          - REJECTED
          description: ACCEPTED 반영, DUPLICATE 이미 받음(최초 결과 반환), REJECTED 오류
        serverResult:
          type: string
          enum:
          - FOUND
          - MISPLACED
          - OUT_OF_SCOPE
          - UNREGISTERED
          - DUPLICATE
          - RETIRED_ASSET
          description: 서버 판정
        countItemId:
          type: string
          format: uuid
          description: 실사 대상
        assetId:
          type: string
          format: uuid
          description: 자산
        code:
          type: string
          description: 오류 코드(REJECTED)
        message:
          type: string
          description: 메시지
      required:
      - clientScanId
      - status
    TaskProgress:
      type: object
      description: 룸 진행
      properties:
        taskId:
          type: string
          format: uuid
          description: 작업
        foundCount:
          type: integer
          description: 확인 수
        pendingCount:
          type: integer
          description: 미확인 수
      required:
      - taskId
      - foundCount
      - pendingCount
    ScanBatchResult:
      type: object
      description: 스캔 일괄 결과
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ScanResultItem'
          description: 건별 결과(요청 순서)
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskProgress'
          description: 영향받은 룸 진행
      required:
      - results
      - tasks
    UnregisteredIn:
      type: object
      description: 미등록 자산 1건(PDA-06)
      properties:
        clientScanId:
          type: string
          format: uuid
          description: PDA UUID. 멱등성 키
        campaignId:
          type: string
          format: uuid
          description: 캠페인
        roomId:
          type: string
          format: uuid
          description: 발견 룸
        provisionalNo:
          type: string
          maxLength: 20
          description: '기기 임시번호(화면 표시용, 예: TC58A-0007)'
        categoryId:
          type: string
          format: uuid
          description: 카테고리
        description:
          type: string
          maxLength: 100
          description: 설명
        serialNo:
          type: string
          maxLength: 40
          description: 시리얼
        scannedBarcode:
          type: string
          maxLength: 40
          description: 읽은 값(있으면)
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
          description: 사진 1장 이상(필수)
        reportedAt:
          type: string
          format: date-time
          description: 기기 시각
      required:
      - clientScanId
      - campaignId
      - roomId
      - provisionalNo
      - description
      - attachmentIds
      - reportedAt
    UnregisteredBatch:
      type: object
      description: 미등록 자산 일괄 전송(최대 50건)
      properties:
        deviceId:
          type: string
          format: uuid
          description: 기기
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnregisteredIn'
          description: 미등록 자산
      required:
      - deviceId
      - items
    UnregisteredResultItem:
      type: object
      description: 미등록 건별 결과
      properties:
        clientScanId:
          type: string
          format: uuid
          description: 요청의 clientScanId
        status:
          type: string
          enum:
          - ACCEPTED
          - DUPLICATE
          - REJECTED
          description: 처리 결과
        tempNo:
          type: string
          maxLength: 12
          description: 서버 채번 UNREG-nnnn (캠페인 내 유일)
        code:
          type: string
          description: 오류 코드
        message:
          type: string
          description: 메시지
      required:
      - clientScanId
      - status
    UnregisteredBatchResult:
      type: object
      description: 미등록 일괄 결과
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UnregisteredResultItem'
          description: 건별 결과
      required:
      - results
    PresignRequest:
      type: object
      description: 사진 업로드 URL 요청
      properties:
        fileName:
          type: string
          maxLength: 200
          description: 파일명
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
          description: MIME
        sizeBytes:
          type: integer
          description: 크기(최대 5 MB)
        sha256:
          type: string
          maxLength: 64
          description: 파일 해시(업로드 후 검증)
        ownerType:
          type: string
          enum:
          - count_item
          - count_unregistered
          description: 연결 대상 종류
      required:
      - fileName
      - contentType
      - sizeBytes
      - sha256
      - ownerType
    PresignResponse:
      type: object
      description: 사진 업로드 URL
      properties:
        attachmentId:
          type: string
          format: uuid
          description: attachment.id. 스캔·미등록 전송에 사용
        uploadUrl:
          type: string
          description: S3 presigned PUT URL
        headers:
          type: object
          additionalProperties: true
