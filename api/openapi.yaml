      type: object
      description: 전기 1건(공통 봉투)
      properties:
        postingId:
          type: string
          maxLength: 12
          description: ALM 요청번호. BKTXT에 기재, 멱등성 키
        type:
          type: string
          enum:
          - ASSET_CREATE
          - ASSET_CHANGE
          - ASSET_TRANSFER
          - ASSET_RETIRE
          - COUNT_RESULT
          - PO_CREATE
          description: 전기 유형
        companyCode:
          type: string
          maxLength: 4
          description: 회사코드
        postingDate:
          type: string
          format: date
          description: 전기일
        valueDate:
          type: string
          format: date
          description: 가치일 BZDAT
        asset:
          allOf:
          - $ref: '#/components/schemas/AssetRef'
          description: 대상 자산(PO_CREATE는 없음)
        payload:
          description: type별 payload
          oneOf:
          - $ref: '#/components/schemas/AssetCreatePayload'
          - $ref: '#/components/schemas/AssetChangePayload'
          - $ref: '#/components/schemas/AssetTransferPayload'
          - $ref: '#/components/schemas/AssetRetirePayload'
          - $ref: '#/components/schemas/CountResultPayload'
          - $ref: '#/components/schemas/PoCreatePayload'
        approvedBy:
          type: string
          description: 최종 승인자(이메일)
        approvedAt:
          type: string
          format: date-time
          description: 최종 승인 일시
        attempt:
          type: integer
          description: 시도 횟수(1부터)
        leaseUntil:
          type: string
          format: date-time
          description: 잠금 만료. 만료까지 결과가 없으면 다시 대상
      required:
      - postingId
      - type
      - companyCode
      - postingDate
      - payload
      - approvedBy
      - approvedAt
      - attempt
      - leaseUntil
