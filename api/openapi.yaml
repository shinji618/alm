    get:
      operationId: authCallback
      summary: 로그인 콜백
      tags:
      - WEB
      description: '로그인 화면 · 테이블: app_user, security_event


        - state 확인 → 코드 교환(웹 앱 클라이언트, 비밀 있음) → 액세스 토큰의 username(ID 토큰은 cognito:username)으로 auth_tenant_by_username() → 테넌트·idp_subject.

        - app_user를 (tenant, idp_subject)로 찾는다. 없으면 idp_subject가 비어 있고 이메일이 같은 미리 등록된 사용자에 연결(ID 토큰 email_verified가 true이거나 SAML일 때만). 그래도 없으면 tenant.jit_provision이 true일 때만 EMPLOYEE로 생성, 아니면 403 ALM-E405.
