components:
  securitySchemes:
    webAuth:
      type: oauth2
      description: Cognito + 고객사 SSO(SAML/OIDC), Authorization Code + PKCE를 서버(/auth/login·/auth/callback)가 처리. SPA는 /auth/refresh로 받은 액세스 토큰(15분)을 Bearer로 보냄. 리프레시 8시간은 HttpOnly 쿠키
      flows:
        authorizationCode:
          authorizationUrl: https://auth.{domain}/oauth2/authorize
          tokenUrl: https://auth.{domain}/oauth2/token
          scopes:
            web: 웹 화면
    pdaAuth:
      type: oauth2
      description: Cognito 호스티드 UI + 고객사 SSO. Authorization Code + PKCE. 액세스 60분, 리프레시 24시간
      flows:
        authorizationCode:
          authorizationUrl: https://auth.{domain}/oauth2/authorize
          tokenUrl: https://auth.{domain}/oauth2/token
          scopes:
            pda: PDA 실사
    sapAuth:
      type: oauth2
      description: Client Credentials. 토큰 60분
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            sap.api: SAP 연계
  parameters:
    SapSystem:
      name: X-SAP-System
      in: header
      required: false
      schema:
        type: string
        maxLength: 10
      description: 'SAP 시스템ID-클라이언트 (예: PRD-100). 로그 기록용. sap_connection과 다르면 403'
    CompanyCode:
      name: X-Company-Code
      in: header
      required: false
      schema:
        type: string
        maxLength: 4
      description: 회사코드. 토큰에 허용된 회사코드가 아니면 403
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 40
      description: PDA 기기 시리얼(MDM 앱 설정 값). 등록 안 된·비활성 기기면 403 ALM-E406
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: 요청 추적 ID. 없으면 서버가 만들어 응답 헤더로 돌려줌
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 80
      description: 24시간 안의 같은 키는 저장된 응답을 그대로 반환
  responses:
    E400:
      description: 형식 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: 인증 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: 권한 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: 대상 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: 충돌
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E410:
      description: 동기화 토큰 만료
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E413:
      description: 파일 크기 초과
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: 업무 규칙 위반
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E429:
      description: 호출 제한
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E500:
      description: 서버 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: 오류 응답 (RFC 9457 application/problem+json)
      properties:
        type:
          type: string
          description: '오류 유형 URI (예: https://alm.bsg/errors/validation)'
        title:
          type: string
          description: 요약
        status:
          type: integer
          description: HTTP 상태
        code:
          type: string
          description: 'ALM 오류 코드 (예: ALM-E104)'
        detail:
          type: string
          description: 상세 설명
        correlationId:
          type: string
          format: uuid
          description: X-Correlation-Id 값
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: 필드별 오류
      required:
      - type
      - title
      - status
      - code
      - correlationId
    FieldError:
      type: object
      description: 필드 오류
      properties:
        field:
          type: string
          description: 'JSON 경로 (예: records[3].costCenter)'
        code:
          type: string
          description: ALM 오류 코드
        message:
          type: string
          description: 메시지
      required:
      - field
      - code
      - message
    ItemResult:
      type: object
      description: 배치 건별 결과
      properties:
        key:
          type: string
          description: '레코드 키 (예: 1000/000300001234/0000)'
        status:
          type: string
          enum:
          - OK
          - ERROR
          - SKIPPED
          description: OK 반영, ERROR 오류, SKIPPED 변경 없음
        code:
          type: string
          description: 오류 코드
        message:
          type: string
          description: 메시지
      required:
      - key
      - status
    BatchResult:
      type: object
      description: 배치 수신 응답. 일부 오류면 HTTP 207
      properties:
        batchId:
          type: string
          description: 요청의 batchId
        received:
          type: integer
          description: 받은 건수
        succeeded:
          type: integer
          description: 반영 건수
        failed:
          type: integer
          description: 오류 건수
        results:
          type: array
          items:
            $ref: '#/components/schemas/ItemResult'
          description: 건별 결과(오류·SKIPPED만 담고, 성공 건은 생략 가능)
      required:
      - batchId
      - received
      - succeeded
      - failed
      - results
    PdaMe:
      type: object
      description: 로그인 사용자와 앱 설정
      properties:
        userId:
          type: string
          format: uuid
          description: app_user.id
        displayName:
          type: string
          description: 이름
        email:
          type: string
          description: 이메일
        locale:
          type: string
          enum:
          - en
          - ko
          description: 화면 언어
        roles:
          type: array
          items:
            type: string
          description: 역할 코드 (COUNTER 필수)
        tenantCode:
          type: string
          description: 테넌트 코드
        serverTime:
          type: string
          format: date-time
          description: 서버 시각(기기 시계 보정용)
        minAppVersion:
          type: string
          description: 최소 앱 버전. 낮으면 업데이트 안내
        offlineHours:
          type: integer
          description: 오프라인 허용 시간(기본 24)
      required:
      - userId
      - displayName
      - email
      - locale
      - roles
      - tenantCode
      - serverTime
      - minAppVersion
      - offlineHours
    DeviceRegister:
      type: object
      description: 기기 등록 요청
      properties:
        deviceSerial:
          type: string
          maxLength: 40
          description: 기기 시리얼
        model:
          type: string
          maxLength: 40
          description: '모델 (예: TC58)'
        appVersion:
          type: string
          maxLength: 20
          description: 앱 버전
      required:
      - deviceSerial
      - appVersion
    Device:
      type: object
      description: 기기 등록 결과
      properties:
        deviceId:
          type: string
          format: uuid
          description: pda_device.id
        lastSyncAt:
          type: string
          format: date-time
          description: 마지막 동기화
      required:
      - deviceId
    PdaTask:
      type: object
      description: 내 룸 실사 작업
      properties:
        taskId:
          type: string
          format: uuid
          description: count_task.id
        campaignId:
          type: string
          format: uuid
          description: 캠페인
        campaignCode:
          type: string
          maxLength: 6
          description: '캠페인 코드 (예: PI26Q4)'
        campaignName:
          type: string
          description: 캠페인 이름
        keyDate:
          type: string
          format: date
          description: 기준일
        dueDate:
          type: string
          format: date
          description: 기한
        roomId:
          type: string
          format: uuid
          description: 룸
        roomCode:
          type: string
          maxLength: 10
          description: 룸 코드
        roomName:
          type: string
          description: 룸 이름
        siteCode:
          type: string
          maxLength: 10
          description: 사이트
        status:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
          description: 작업 상태
        expectedCount:
          type: integer
          description: 대상 자산 수
