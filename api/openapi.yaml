openapi: 3.1.0
info:
  title: ALM API — Web · PDA · SAP
  version: 0.4.0
  license:
    name: Proprietary — BSG America
    identifier: LicenseRef-BSG-Proprietary
  description: BSG America Asset Lifecycle Manager. WBS 2.6 — 웹 화면, PDA, SAP. WBS 2.8 — x-permission(권한 키)·x-scope(역할별 범위).
servers:
- url: https://alm.{domain}/api/v1
  variables:
    domain:
      default: example.com
tags:
- name: PDA
  description: PDA 실사 앱 (Zebra TC58)
- name: SAP
  description: SAP S/4HANA 배치 잡(아웃바운드 호출)
- name: WEB
  description: 웹 화면(React SPA)
paths:
  /pda/me:
    get:
      operationId: pdaGetMe
      summary: 로그인 사용자·앱 설정
      tags:
      - PDA
      description: 'PDA-01 · 테이블: app_user, user_role


        - COUNTER 역할이 없으면 403 ALM-E401.

        - 앱은 serverTime으로 기기 시계 차이를 기록하고 scannedAt 보정에 쓴다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdaMe'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
  /pda/devices/{deviceSerial}:
    put:
      operationId: pdaRegisterDevice
      summary: 기기 등록·갱신
      tags:
      - PDA
      description: 'PDA-01 · 테이블: pda_device


        - 같은 시리얼이면 갱신(멱등). last_user_id·app_version·last_sync_at 기록.

        - 처음 보는 시리얼은 설정 pda.device_approval이 true면 비활성(관리자 승인 대기)으로 등록하고 403 ALM-E406, false(기본, 파일럿)면 바로 활성.

        - 비활성 기기는 이 API를 포함한 모든 PDA API가 403 ALM-E406(security_event DEVICE_BLOCKED).'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      - name: deviceSerial
        in: path
        required: true
        description: 기기 시리얼
        schema:
          type: string
          maxLength: 40
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegister'
  /pda/tasks:
    get:
      operationId: pdaListTasks
      summary: 내 실사 작업 목록
      tags:
      - PDA
      description: 'PDA-02 · 테이블: count_task, count_campaign, room


        - assignee = 로그인 사용자이고 캠페인 단계가 COUNTING인 작업만.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      - name: status
        in: query
        required: false
        description: 상태 필터
        schema:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
          - COMPLETED
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdaTaskList'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
  /pda/campaigns/{campaignId}/worklist:
    get:
      operationId: pdaGetWorklist
      summary: 작업목록 다운로드(전체·델타)
      tags:
      - PDA
      description: 'PDA-01 · 테이블: count_item, asset, room


        - 내게 배정된 룸의 count_item만 내려준다. 기기 저장 한도 1만 건.

        - since 없이 호출하면 전체, since=syncToken이면 그 뒤 바뀐 행과 removed만.

        - syncToken이 7일보다 오래되면 410 ALM-E309 → 전체 다시 받기.

        - 응답은 gzip. If-None-Match(ETag)가 같으면 304.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      - name: campaignId
        in: path
        required: true
        description: 캠페인
        schema:
          type: string
          format: uuid
      - name: since
        in: query
        required: false
        description: 이전 syncToken
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        description: 페이지 커서
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: 페이지 크기(기본 2,000, 최대 5,000)
        schema:
          type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklistPage'
        '304':
          description: 변경 없음(ETag 일치)
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '410':
          $ref: '#/components/responses/E410'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
  /pda/campaigns/{campaignId}/tag-index:
    get:
      operationId: pdaGetTagIndex
      summary: 범위 밖 태그 색인
      tags:
      - PDA
      description: 'PDA-04 · 테이블: asset


        - 작업목록에 없는 태그를 오프라인에서 OUT_OF_SCOPE·RETIRED_ASSET·UNREGISTERED로 가르기 위한 색인.

        - 같은 테넌트의 다른 자산 태그와 상태만(개인정보 없음). 델타·페이지 규칙은 worklist와 같다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      - name: campaignId
        in: path
        required: true
        description: 캠페인
        schema:
          type: string
          format: uuid
      - name: since
        in: query
        required: false
        description: 이전 syncToken
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        description: 페이지 커서
        schema:
          type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagIndexPage'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
  /pda/assets/{assetTag}:
    get:
      operationId: pdaGetAsset
      summary: 자산 조회(바코드 → 상세)
      tags:
      - PDA
      description: 'PDA-09 · 테이블: asset, count_item, asset_event


        - 어느 화면에서든 자산태그를 찍어 상세를 본다(실사 기록은 남기지 않음). 태그는 대소문자 무시.

        - 전체 정보: 사용자의 asset.read 범위 안 자산, 또는 내게 배정된 실사(COUNTING·REVIEW) 캠페인의 대상 자산. 그 밖은 limited=true로 태그·상태·사이트만.

        - 금액(acquisitionValue·netBookValue)은 amount.read가 있을 때만. 없는 태그는 404 ALM-E404.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      - name: assetTag
        in: path
        required: true
        description: 자산태그(바코드 값)
        schema:
          type: string
          maxLength: 30
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdaAssetDetail'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
  /pda/rooms:
    get:
      operationId: pdaListRooms
      summary: 룸 목록
      tags:
      - PDA
      description: 'PDA-03 · 테이블: room, site


        - 캠페인 범위의 사이트에 있는 활성 룸 전체(다른 룸에서 발견한 자산 기록용).'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      - name: campaignId
        in: query
        required: true
        description: 캠페인
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdaRoomList'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
  /pda/codes:
    get:
      operationId: pdaGetCodes
      summary: 코드값
      tags:
      - PDA
      description: 'PDA-05·06 · 테이블: category, code


        - 사용자 locale로 이름을 내려준다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdaCodes'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
  /pda/tasks/{taskId}:
    patch:
      operationId: pdaUpdateTask
      summary: 룸 작업 시작·완료
      tags:
      - PDA
      description: 'PDA-07 · 테이블: count_task


        - COMPLETE이고 미확인 자산이 남았는데 force가 아니면 409 ALM-E305(남은 수 반환).

        - 완료한 룸에 스캔이 더 들어오면 작업을 IN_PROGRESS로 되돌린다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: taskId
        in: path
        required: true
        description: 작업
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdaTask'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
  /pda/attachments:presign:
    post:
      operationId: pdaPresignPhoto
      summary: 사진 업로드 URL 발급
      tags:
      - PDA
      description: 'PDA-05·06 · 테이블: attachment


        - 발급 시 attachment 행을 owner 없이 만들고(linked_at 비움), 스캔·미등록 전송에서 연결될 때 owner_id·linked_at을 채운다.

        - 24시간 안에 연결되지 않은 첨부 행과 S3 객체는 정리 배치가 지운다.

        - 최대 5 MB, JPEG·PNG. 기기에서 긴 변 1,600px로 줄여 올린다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '413':
          $ref: '#/components/responses/E413'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
  /pda/scans:batch:
    post:
      operationId: pdaPostScans
      summary: 스캔 일괄 전송
      tags:
      - PDA
      description: 'PDA-04·05·08 · 테이블: count_scan, count_item, count_task, asset, label_print_job


        - 건별로 처리하고 실패해도 다음 건을 계속한다. 하나라도 REJECTED면 207.

        - 같은 clientScanId는 DUPLICATE로 최초 결과를 돌려준다(재전송 안전).

        - 서버가 판정을 다시 한다. 기기 판정과 다르면 serverResult가 기준.

        - 같은 자산을 여러 번 스캔하면 scannedAt이 가장 늦은 스캔이 count_item에 남는다.

        - MISSING 자산을 스캔하면 status_before_missing으로 복원하고 asset_event를 남긴다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBatchResult'
        '207':
          description: 일부 성공(건별 결과 확인)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanBatchResult'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBatch'
  /pda/unregistered:batch:
    post:
      operationId: pdaPostUnregistered
      summary: 미등록 자산 일괄 전송
      tags:
      - PDA
      description: 'PDA-06 · 테이블: count_unregistered, attachment, number_sequence


        - tempNo(UNREG-nnnn)는 서버가 캠페인 안에서 채번한다. 기기는 provisionalNo를 tempNo로 바꿔 표시.

        - 사진이 없으면 REJECTED ALM-E110.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnregisteredBatchResult'
        '207':
          description: 일부 성공(건별 결과 확인)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnregisteredBatchResult'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: count.scan
      x-scope:
        COUNTER: TASK
      security:
      - pdaAuth:
        - pda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnregisteredBatch'
  /oauth/token:
    post:
      operationId: sapToken
      summary: 토큰 발급(Client Credentials)
      tags:
      - SAP
      description: '공통 · 테이블: sap_connection


        - 요청은 application/x-www-form-urlencoded: grant_type=client_credentials, scope=sap.api. 클라이언트 인증은 HTTP Basic(client_secret_basic, 권장 — SAP SM59 로그온 정보에 저장) 또는 본문의 client_id·client_secret(client_secret_post).

        - 내부적으로 Cognito 앱 클라이언트 토큰을 발급한다. 토큰의 client_id로 sap_connection → 테넌트·회사코드를 정한다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                  - client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
                  default: sap.api
  /sap/ping:
    get:
      operationId: sapPing
      summary: 연결 확인
      tags:
      - SAP
      description: 'SM59 테스트 · 테이블: sap_connection


        - SM59 연결 테스트·배치 시작 전 확인용. 부하 없음.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SapSystem'
      - $ref: '#/components/parameters/CompanyCode'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SapPing'
        '401':
          $ref: '#/components/responses/E401'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: sap.api
      security:
      - sapAuth:
        - sap.api
  /sap/master-data:
    post:
      operationId: sapPostMasterData
      summary: 조직·코드 마스터 수신
      tags:
      - SAP
      description: 'IF-MD-01 · 테이블: company, plant, cost_center, profit_center, asset_class


        - 유형별로 분할 전송하고 isLast=true에서 이번 배치에 없던 코드를 is_active=false로 바꾼다(삭제 안 함).

        - 순서: COMPANY → PLANT → PROFIT_CENTER → COST_CENTER → ASSET_CLASS → LOCATION(참조 순). chunkNo는 유형마다 1부터, 409 ALM-E303이면 그 유형을 새 batchId로 처음부터 다시 보낸다.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SapSystem'
      - $ref: '#/components/parameters/CompanyCode'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '207':
          description: 일부 성공(건별 결과 확인)
          content:
            application/json:
              schema:
