        - 이메일·이름은 ID 토큰 값으로 갱신. last_login_at 기록, security_event LOGIN(거부는 LOGIN_DENIED).

        - 리프레시 토큰은 AES-GCM으로 암호화해 쿠키 alm_rt(HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth, 8시간)에 둔다. 서버에 세션 저장소 없음.'
