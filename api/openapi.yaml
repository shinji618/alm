        - 공정가치 = 원가 × 계수(기준 연도 이하 가장 최근 표, 경과연수가 표를 넘으면 마지막 값). 평가액 = (공정가치 − 면제) × 평가율. 예상 세액 = 평가액 × 밀리지 ÷ 1,000.

