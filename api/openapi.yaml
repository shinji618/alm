    post:
      operationId: resolveReconDiffs
      summary: 대사 차이 처리
      tags:
      - WEB
      description: 'ALM-310 · 테이블: recon_diff, asset, sap_posting, asset_event


        - 건별 처리(오류가 있으면 207). 유형별 처리: SAP_ONLY(SAP_TO_ALM·IGNORE), ALM_ONLY(IGNORE), COST_CENTER(SAP_TO_ALM·IGNORE), LOCATION·SERIAL(ALM_TO_SAP·SAP_TO_ALM·IGNORE), TAG(ALM_TO_SAP·IGNORE), RETIRED(SAP_TO_ALM·IGNORE).

        - SAP_TO_ALM: 코스트센터·룸·시리얼을 SAP 값으로, RETIRED는 ALM RETIRED(할당 종료), SAP_ONLY는 IF-AA-01 수동 실행 요청(한 번).

        - ALM_TO_SAP: 변경 요청(출처 RECONCILIATION, 승인 생략) + ASSET_CHANGE 전기 건(IF-AA-04). 같은 자산에 진행 중인 요청이 있으면 그 건 ALM-E315.

        - SAP 연계를 끈 회사의 자산은 ALM-E322.'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '207':
          description: 일부 성공(건별 결과 확인)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '400':
          $ref: '#/components/responses/E400'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
      x-permission: sap.finance
      x-scope:
        ASSET_ACCOUNTANT: ALL
      security:
      - webAuth:
        - web
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconResolve'
