# PR·main 검사(10 정의서 11장 "CI 검사"). 모든 작업이 통과해야 병합한다(브랜치 보호 규칙).
name: ci
on:
  pull_request:
  workflow_call:   # main·태그 푸시는 deploy.yml이 이 검사를 먼저 부른다
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '22'

jobs:
  web:
    name: 웹(타입·단위 시험·빌드)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  contracts:
    name: 계약(생성물 일치·OpenAPI·Prisma)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.3
      - name: API·권한 생성물 다시 만들기
        working-directory: api/spec
        run: |
          mkdir -p out && python gen_api.py && python build_md.py && python build_web_md.py
          cp out/openapi.yaml out/permissions.json out/README.md ../
      - name: DB 생성물 다시 만들기
        working-directory: db/spec
        run: python gen.py
      - name: 커밋된 생성물과 같은지
        run: |
          if ! git diff --exit-code -- api db; then
            echo "::error::생성물이 원본(spec)과 다릅니다. api/spec·db/spec 생성기를 실행한 결과를 커밋하세요."; exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: OpenAPI 검증
        run: npx --yes @redocly/cli@2.62.1 lint api/openapi.yaml
      - name: Prisma 스키마 검증
        run: npx --yes prisma@7.10.0 validate --schema db/schema.prisma

  db-security:
    name: DB 보안 시험(PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: db/spec/run_security_test.sh

  infra:
    name: 인프라(CDK synth·cdk-nag·시험)
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: infra }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: bash -n scripts/deploy.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: cdk-nag-report, path: infra/cdk.out/validation-report.json, if-no-files-found: ignore }

  sast:
    name: 보안 정적 분석(Semgrep)
    runs-on: ubuntu-24.04
    container: { image: semgrep/semgrep:1.180.0 }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --severity ERROR --metrics off --error --exclude node_modules --exclude dist
